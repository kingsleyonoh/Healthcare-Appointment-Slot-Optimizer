# Production deployment with Traefik reverse proxy
# Deploy: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: healthcare-slot-optimizer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik-public
      - internal
    labels:
      # Traefik auto-discovery
      - "traefik.enable=true"
      - "traefik.http.routers.healthcare-slot-optimizer.rule=Host(`scheduler.kingsleyonoh.com`)"
      - "traefik.http.routers.healthcare-slot-optimizer.entrypoints=websecure"
      - "traefik.http.routers.healthcare-slot-optimizer.tls.certresolver=letsencrypt"
      - "traefik.http.services.healthcare-slot-optimizer.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge
