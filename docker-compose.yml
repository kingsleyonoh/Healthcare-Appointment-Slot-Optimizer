# Local development services
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: haso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: haso_user
      POSTGRES_PASSWORD: haso_dev_pass
      POSTGRES_DB: haso_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haso_user -d haso_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
